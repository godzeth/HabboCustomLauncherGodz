name: Release Launcher

# On a version tag (v*), build self-contained single-file binaries for every
# supported platform, package them for each OS convention, and publish them as
# release assets on THIS repo (godzeth/HabboCustomLauncherGodz).
#
# Packaging per platform:
#   Windows → raw .exe (double-click to run)
#   Linux   → .tar.gz  (preserves the executable bit lost on browser download)
#   macOS   → .app bundle inside .zip (users run `xattr -cr` to bypass
#             Gatekeeper — the bundle is unsigned & non-notarized, since
#             codesign/notarization is not available on the Linux builder and
#             would require attaching an Apple Developer identity by design)
#
# Also runnable manually via workflow_dispatch for testing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # gh release create (same repo) via GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    # .NET cross-publishes every RID from a single Linux runner — no matrix of
    # OS runners needed. Matrix fans out the publish + package per RID.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows target is win-x86 (matches the project's RID-conditioned
          # Windows patch zips; x86 also covers x64 + Win7 for max compat).
          - rid: win-x86
            asset: HabboCustomLauncherGodz.exe
            binary: HabboCustomLauncher.exe      # OutputType=WinExe → .exe
            package: none
          - rid: linux-x64
            asset: HabboCustomLauncherGodz_Linux_x64.tar.gz
            binary: HabboCustomLauncher
            package: targz
          - rid: linux-arm64
            asset: HabboCustomLauncherGodz_Linux_arm64.tar.gz
            binary: HabboCustomLauncher
            package: targz
          - rid: osx-x64
            asset: HabboCustomLauncherGodz_OSX_x64.app.zip
            binary: HabboCustomLauncher
            package: app
          - rid: osx-arm64
            asset: HabboCustomLauncherGodz_OSX_arm64.app.zip
            binary: HabboCustomLauncher
            package: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file (${{ matrix.rid }})
        run: |
          dotnet publish HabboCustomLauncher.vbproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish

      - name: Verify publish output
        run: |
          # Sanity-check the binary exists and is non-trivially sized.
          sz=$(stat -c %s "publish/${{ matrix.binary }}")
          if [ "$sz" -lt 1000000 ]; then
            echo "ERROR: publish/${{ matrix.binary }} is only $sz bytes — publish likely failed"
            exit 1
          fi
          echo "Binary OK: $sz bytes"

      - name: Package — Windows (raw .exe)
        if: matrix.package == 'none'
        run: |
          mv -f "publish/${{ matrix.binary }}" "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"

      - name: Package — Linux (.tar.gz preserving exec bit)
        if: matrix.package == 'targz'
        run: |
          chmod +x "publish/${{ matrix.binary }}"
          # Wrap in a directory named after the asset so extraction is clean.
          dir_name="${{ matrix.asset }}"
          dir_name="${dir_name%.tar.gz}"
          mkdir -p "stage/$dir_name"
          cp "publish/${{ matrix.binary }}" "stage/$dir_name/HabboCustomLauncherGodz"
          chmod +x "stage/$dir_name/HabboCustomLauncherGodz"
          tar czf "${{ matrix.asset }}" -C stage "$dir_name"
          ls -lh "${{ matrix.asset }}"
          echo "Contents:"
          tar tzf "${{ matrix.asset }}"

      - name: Package — macOS (.app bundle)
        if: matrix.package == 'app'
        run: |
          APP_NAME="HabboCustomLauncherGodz"
          APP_DIR="$APP_NAME.app"

          # Build the .app directory structure.
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          # Place the binary.
          cp "publish/${{ matrix.binary }}" "$APP_DIR/Contents/MacOS/"
          chmod +x "$APP_DIR/Contents/MacOS/${{ matrix.binary }}"

          # Copy the icon.
          cp "Assets/HabboCustomLauncherIcon.icns" "$APP_DIR/Contents/Resources/AppIcon.icns"

          # Write Info.plist.
          cp "Assets/Info.plist" "$APP_DIR/Contents/Info.plist"

          # PkgInfo (8-byte signature — helps Finder identify the bundle).
          printf 'APPL????' > "$APP_DIR/Contents/PkgInfo"

          # Zip the bundle. -X strips extra file attributes that confuse
          # macOS Archive Utility; -y preserves symlinks as-is.
          zip -r -X -y "${{ matrix.asset }}" "$APP_DIR"
          ls -lh "${{ matrix.asset }}"
          echo "App bundle structure:"
          find "$APP_DIR" -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        run: |
          TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          ls -lh assets/
          # Same-repo publish → gh uses GITHUB_TOKEN + GITHUB_REPOSITORY by default.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets (clobber)."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" assets/* --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "HabboCustomLauncherGodz $TAG" \
              --notes "$(cat <<'EOF'
          ## Downloads

          | OS | Download | Instructions |
          |---|---|---|
          | **Windows** (7+) | `HabboCustomLauncherGodz.exe` | Double-click to run. |
          | **Linux** (x64/arm64) | `HabboCustomLauncherGodz_Linux_*.tar.gz` | Extract, then run the binary inside. |
          | **macOS** (Intel) | `HabboCustomLauncherGodz_OSX_x64.app.zip` | Unzip, then run `xattr -cr` (see macOS note). |
          | **macOS** (Apple Silicon) | `HabboCustomLauncherGodz_OSX_arm64.app.zip` | Unzip, then run `xattr -cr` (see macOS note). |

          ### macOS note

          The app is **not signed and not notarized** (by design — no Apple Developer
          identity is attached, so distribution stays identity-free). As a result macOS
          Gatekeeper will block the unzipped app as "damaged" or "from an unidentified
          developer" on first launch.

          **Reliable fix (all macOS versions, incl. Sonoma/Sequoia):**

          1. Unzip the downloaded `.app.zip`.
          2. Open **Terminal** and run:
             ```bash
             xattr -cr "/path/to/HabboCustomLauncherGodz.app"
             ```
             (Tip: drag the `.app` onto the Terminal window to paste its path.)
          3. Double-click the `.app` to launch it.

          The "right-click → Open → Open anyway" path often **does not work** on
          macOS 14+ (Sonoma/Sequoia), where unsigned apps are reported as "damaged"
          with no Open button — use the `xattr -cr` command above instead.
          EOF
          )" \
              assets/*
          fi
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
