name: Release Launcher

# On a version tag (v*), build self-contained single-file binaries for every
# supported platform and publish them as release assets on THIS repo
# (godzeth/HabboCustomLauncherGodz). Because we publish to the same repo the
# workflow lives in, the built-in GITHUB_TOKEN is sufficient — no PAT needed
# (unlike the SWF release.yml, which cross-publishes to other repos).
# Also runnable manually via workflow_dispatch for testing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # gh release create (same repo) via GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    # .NET cross-publishes every RID from a single Linux runner — no matrix of
    # OS runners needed. Matrix is only to fan out the publish + rename per RID.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows target is win-x86 (matches the project's RID-conditioned
          # Windows patch zips; x86 also covers x64 + Win7 for max compat).
          - rid: win-x86
            asset: HabboCustomLauncherGodz.exe
            binary: HabboCustomLauncher.exe      # OutputType=WinExe → .exe
          - rid: linux-x64
            asset: HabboCustomLauncherGodz_Linux_x64
            binary: HabboCustomLauncher           # no extension on Unix
          - rid: linux-arm64
            asset: HabboCustomLauncherGodz_Linux_arm64
            binary: HabboCustomLauncher
          - rid: osx-x64
            asset: HabboCustomLauncherGodz_OSX_x64
            binary: HabboCustomLauncher
          - rid: osx-arm64
            asset: HabboCustomLauncherGodz_OSX_arm64
            binary: HabboCustomLauncher
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file (${{ matrix.rid }})
        run: |
          dotnet publish HabboCustomLauncher.vbproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish

      - name: Stage Godz-branded asset
        run: |
          # The single-file host binary is publish/<binary>. Rename to the
          # Godz asset name and confirm it's a non-trivial file.
          mv -f "publish/${{ matrix.binary }}" "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"
          sz=$(stat -c %s "${{ matrix.asset }}")
          if [ "$sz" -lt 1000000 ]; then
            echo "ERROR: ${{ matrix.asset }} is only $sz bytes — publish likely failed"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        run: |
          TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          ls -lh assets/
          # Same-repo publish → gh uses GITHUB_TOKEN + GITHUB_REPOSITORY by default.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets (clobber)."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" assets/* --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "HabboCustomLauncherGodz $TAG" \
              --notes "Self-contained single-file launcher builds for Windows, Linux, and macOS. See the launcher README for per-platform instructions." \
              assets/*
          fi
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
